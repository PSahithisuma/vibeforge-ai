# =============================================================================
# VibeForge — Docker Compose Stack (Phase 0: Infra only)
#
# Services:
#   postgres    — System of record (single source of truth, P5)
#   redis       — Job broker + rate buckets (never system of record)
#   qdrant      — Vector store for RAG + semantic cache
#   minio       — Object storage (docs, bundles, build logs, SBOMs)
#   keycloak    — OIDC provider (JWT issuance + JWKS endpoint)
#   langfuse    — LLM observability (Phase 0: running, not yet wired)
#   prometheus  — Metrics collection
#   grafana     — Dashboards
#
# API and Worker services are defined at the bottom, commented out.
# Uncomment when services/api/ and services/worker/ are built in Phase 0+.
#
# Usage:
#   cp .env.example .env     # fill in secrets
#   make up                  # bring up all infra
#   make health              # verify all services healthy
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # POSTGRESQL 16 — System of record
  # Init scripts in infra/postgres/init/ run on first boot in lexicographic order:
  #   00_create_dbs.sh  → create keycloak + langfuse sibling DBs
  #   01_schema.sql     → vibeforge main schema + app role + seed data
  #   02_rls.sql        → RLS policies (Contract C9)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vibeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibeforge_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vibeforge}
      # Expose init scripts to postgres entrypoint
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibeforge} -d ${POSTGRES_DB:-vibeforge}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vibeforge
    shm_size: '256mb'    # prevent shared memory OOM on complex queries

  # ---------------------------------------------------------------------------
  # REDIS 7 — Job broker (Arq), rate buckets, hot counters
  # AOF enabled for persistence — but Redis is NEVER the system of record.
  # If Redis dies, jobs are not lost because truth lives in Postgres.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vibeforge-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-redis_dev_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # QDRANT — Vector store
  # Per-tenant collections with payload filtering for tenant isolation.
  # Holds: RAG doc embeddings, semantic cache index.
  # Phase 0: running and reachable; collections created in Phase 1.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: vibeforge-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC API
    healthcheck:
      # Qdrant's minimal image has no curl/wget. Use bash TCP check against the REST port.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # MINIO — Object storage
  # Buckets: vf-docs, vf-bundles, vf-build-logs
  # Console at :9001; S3-compatible API at :9000.
  # Run `make init-minio` after first boot to create the buckets.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: vibeforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vibeforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vibeforge_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # MINIO INIT — one-shot bucket creation
  # Uses the mc (MinIO Client) image to create required buckets on first run.
  # Exits 0 when done. docker compose up --no-recreate will skip it on rerun.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: vibeforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set vf http://minio:9000 ${MINIO_ROOT_USER:-vibeforge} ${MINIO_ROOT_PASSWORD:-vibeforge_minio_secret};
        mc mb --ignore-existing vf/${MINIO_BUCKET_DOCS:-vf-docs};
        mc mb --ignore-existing vf/${MINIO_BUCKET_BUNDLES:-vf-bundles};
        mc mb --ignore-existing vf/${MINIO_BUCKET_LOGS:-vf-build-logs};
        echo '[minio-init] Buckets ready.';
      "
    networks:
      - vibeforge
    restart: "no"    # run once only

  # ---------------------------------------------------------------------------
  # KEYCLOAK 24 — OIDC provider
  # Runs in dev mode (start-dev) with HTTP enabled for local use.
  # Imports vibeforge-realm.json on first boot (--import-realm flag).
  # Uses Postgres backend (keycloak DB created by 00_create_dbs.sh).
  # Admin UI: http://localhost:8080  (admin / admin)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: vibeforge-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-vibeforge}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-vibeforge_dev_secret}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 24 image has no curl. Use bash TCP check on port 8080.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 120s   # Keycloak + realm import on first boot takes 2-3 min
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # LANGFUSE 2 — LLM observability
  # Traces every agent step linked by job_id (Phase 1+ wiring).
  # Phase 0: running and reachable at http://localhost:3001
  # Uses the langfuse DB created by 00_create_dbs.sh.
  # ---------------------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2
    container_name: vibeforge-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibeforge}:${POSTGRES_PASSWORD:-vibeforge_dev_secret}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-nextauth-secret-dev}
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT:-langfuse-salt-dev}
      LANGFUSE_CSP_ENFORCE_HTTPS: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Next.js binds to external IP, not 127.0.0.1. Use hostname which resolves
      # to the container's actual IP via Docker's /etc/hosts injection.
      test: ["CMD-SHELL", "nc -z $(hostname) 3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Metrics collection
  # Scrapes: self, vibeforge-api, vibeforge-worker, qdrant
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: vibeforge-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # GRAFANA — Dashboards
  # Auto-provisions: Prometheus datasource + VibeForge Overview dashboard.
  # UI: http://localhost:3000  (admin / admin)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: vibeforge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/vibeforge-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vibeforge

  # ===========================================================================
  # API — FastAPI + Uvicorn (Phase 0+)
  # Docs:     http://localhost:8000/docs
  # Health:   http://localhost:8000/health
  # ===========================================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: vibeforge-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source so uvicorn --reload picks up changes
      - ./services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # python:slim has no nc/curl — use Python's built-in socket to probe the port
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vibeforge

  # ===========================================================================
  # WORKER — Arq job processor (Phase 0+)
  # Picks up jobs from Redis, writes events to Postgres + Redis pub/sub.
  # ===========================================================================
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: vibeforge-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      # Hot-reload: mount source so changes are picked up on container restart
      - ./services/worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibeforge

  # ===========================================================================
  # OLLAMA — Local LLM inference (qwen3:8b)
  # First run: pulls qwen3:8b model (~5GB). Subsequent starts are instant.
  # GPU: mount /dev/nvidia* and set runtime: nvidia if a GPU is available.
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: vibeforge-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - vibeforge

  # ---------------------------------------------------------------------------
  # OLLAMA INIT — pulls qwen3:8b on first boot (one-shot)
  # Streams the pull response; exits 0 when model is ready.
  # docker compose up --no-recreate skips this on subsequent runs.
  # ---------------------------------------------------------------------------
  ollama-init:
    image: curlimages/curl:latest
    container_name: vibeforge-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo '[ollama-init] Pulling qwen3:8b (5GB — first run only)...';
        curl -X POST http://ollama:11434/api/pull
             -H 'Content-Type: application/json'
             -d '{\"name\":\"qwen3:8b\"}'
             --max-time 1200;
        echo '[ollama-init] qwen3:8b ready.';
      "
    networks:
      - vibeforge
    restart: "no"

  # ===========================================================================
  # LITELLM — LLM proxy (Contract C11: routing + budget + Langfuse logging)
  # All agent calls target: http://litellm:4000/v1/chat/completions
  # Model alias: "agent-model" → qwen3:8b on Ollama
  # UI: http://localhost:4001
  # ===========================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: vibeforge-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"    # OpenAI-compatible API
    env_file: .env
    environment:
      # Override DB URL for LiteLLM's own tables
      DATABASE_URL: "postgresql://vibeforge:${POSTGRES_PASSWORD:-vibeforge_dev_secret}@postgres:5432/litellm"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - vibeforge

  # ===========================================================================
  # INGESTION — RAG pipeline: MinIO → Docling → bge-m3 → Qdrant
  # Polls vf-docs bucket every 30s. Object key convention: {tenant_id}/{file}
  # Prometheus metrics on port 9001.
  # model_cache volume shared with retrieval to avoid double download of bge-m3.
  # ===========================================================================
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: vibeforge-ingestion
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      MINIO_ENDPOINT: "minio:9000"
      INGESTION_POLL_INTERVAL: "30"
      INGESTION_METRICS_PORT: "9001"
      DATABASE_URL_SYNC: "postgresql://vibeforge:${POSTGRES_PASSWORD:-vibeforge_dev_secret}@postgres:5432/vibeforge"
    volumes:
      - ./services/ingestion:/app
      - model_cache:/root/.cache   # shared HuggingFace model cache
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - vibeforge

  # ===========================================================================
  # RETRIEVAL — RAG query service: Qdrant search with tenant isolation (C8)
  # POST /retrieve → top-5 chunks for a query, scoped to tenant_id
  # Prometheus metrics on port 9002.
  # ===========================================================================
  retrieval:
    build:
      context: ./services/retrieval
      dockerfile: Dockerfile
    container_name: vibeforge-retrieval
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      RETRIEVAL_METRICS_PORT: "9002"
    ports:
      - "8001:8001"    # REST API
    volumes:
      - ./services/retrieval:/app
      - model_cache:/root/.cache   # shared with ingestion
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 180s    # bge-m3 download on first run
    networks:
      - vibeforge

  # ===========================================================================
  # UI — Streamlit frontend
  # Spec Sheet: option graph form + live impact panel
  # Review Workspace: diff cards + Lock & Generate button
  # URL: http://localhost:8501
  # ===========================================================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: vibeforge-ui
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8000"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "vibeforge"
      KC_CLIENT_ID: "vibeforge-api"
      KC_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-vibeforge-api-secret-change-me}"
      DEV_USERNAME: "${DEV_ADMIN_EMAIL:-admin@vibeforge.local}"
      DEV_PASSWORD: "${DEV_ADMIN_PASSWORD:-admin123}"
    ports:
      - "8501:8501"    # Streamlit UI
    volumes:
      - ./ui:/app      # hot-reload
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vibeforge

# =============================================================================
# VOLUMES — named volumes for persistence
# =============================================================================
volumes:
  postgres_data:
    name: vibeforge_postgres_data
  redis_data:
    name: vibeforge_redis_data
  qdrant_data:
    name: vibeforge_qdrant_data
  minio_data:
    name: vibeforge_minio_data
  prometheus_data:
    name: vibeforge_prometheus_data
  grafana_data:
    name: vibeforge_grafana_data
  ollama_data:
    name: vibeforge_ollama_data      # qwen3:8b model weights (~5GB)
  model_cache:
    name: vibeforge_model_cache      # HuggingFace bge-m3 cache shared by ingestion + retrieval

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  vibeforge:
    name: vibeforge
    driver: bridge
