# =============================================================================
# Cloud Build QA Gate — Java/Spring Boot
# Runs inside Cloud Build (no network — all deps from Artifact Registry)
#
# Gate sequence (Contract C18: --network=none equivalent via VPC SC):
#   1. compile       → mvn package -DskipTests
#   2. test          → mvn test + JaCoCo coverage ≥60%
#   3. migration     → Flyway dry-run on H2 in-memory
#   4. smoke         → spring-boot:run + curl /actuator/health
#   5. semgrep       → SAST p/java ruleset
#   6. trivy         → SCA + CycloneDX SBOM
#   7. gitleaks      → secrets scan
#
# Outputs: GateReport JSON uploaded to GCS
# =============================================================================

steps:

  # ── Step 0: Copy artifact from GCS ─────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gsutil'
    id: fetch-artifact
    args: ['cp', '${_ARTIFACT_GCS_URI}', '/workspace/app.zip']

  - name: 'alpine'
    id: unzip
    args: ['sh', '-c', 'apk add --no-cache unzip && unzip /workspace/app.zip -d /workspace/app']
    waitFor: ['fetch-artifact']

  # ── Step 1: Compile ─────────────────────────────────────────────────────────
  - name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibeforge-docker/toolchain-java:21'
    id: compile
    entrypoint: 'mvn'
    args:
      - '-B'
      - 'package'
      - '-DskipTests'
      - '-s'
      - '/settings.xml'    # points to Artifact Registry Maven repo
    dir: '/workspace/app'
    waitFor: ['unzip']
    env:
      - 'MAVEN_OPTS=-Dmaven.repo.local=/root/.m2 -Xmx512m'

  # ── Step 2: Unit tests + JaCoCo coverage ────────────────────────────────────
  - name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibeforge-docker/toolchain-java:21'
    id: test
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mvn -B test -s /settings.xml -Dmaven.repo.local=/root/.m2 2>&1 | tee /workspace/test.log
        # Extract JaCoCo coverage from report
        COV=$(python3 -c "
        import csv, sys
        total_missed = total_covered = 0
        with open('target/site/jacoco/jacoco.csv') as f:
            for row in csv.DictReader(f):
                total_missed  += int(row['LINE_MISSED'])
                total_covered += int(row['LINE_COVERED'])
        pct = total_covered / (total_missed + total_covered + 0.0001)
        print(f'{pct:.4f}')
        ")
        echo "Coverage: $COV"
        python3 -c "assert float('$COV') >= 0.60, f'Coverage {float(\"$COV\")*100:.1f}% < 60% threshold'"
        echo "$COV" > /workspace/coverage.txt
    dir: '/workspace/app'
    waitFor: ['compile']

  # ── Step 3: DB migration dry-run (Flyway on H2) ─────────────────────────────
  - name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibeforge-docker/toolchain-java:21'
    id: migration
    entrypoint: 'mvn'
    args:
      - '-B'
      - 'flyway:migrate'
      - '-s'
      - '/settings.xml'
      - '-Dflyway.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1'
      - '-Dflyway.user=sa'
      - '-Dflyway.password='
    dir: '/workspace/app'
    waitFor: ['compile']

  # ── Step 4: API smoke test ───────────────────────────────────────────────────
  - name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/vibeforge-docker/toolchain-java:21'
    id: smoke
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mvn -B spring-boot:run -s /settings.xml &
        PID=$!
        # Wait for app to start (max 60s)
        for i in $(seq 1 12); do
          sleep 5
          curl -sf http://localhost:8080/actuator/health && break
          echo "Waiting for app... attempt $i/12"
        done
        curl -sf http://localhost:8080/actuator/health | grep '"status":"UP"' || exit 1
        kill $PID 2>/dev/null
    dir: '/workspace/app'
    waitFor: ['test', 'migration']

  # ── Step 5: Semgrep SAST ─────────────────────────────────────────────────────
  - name: 'returntocorp/semgrep'
    id: semgrep
    args:
      - '--config=p/java'
      - '--config=p/owasp-top-ten'
      - '--json'
      - '--output=/workspace/semgrep.json'
      - '.'
    dir: '/workspace/app'
    waitFor: ['unzip']

  # ── Step 6: Trivy SCA + SBOM ─────────────────────────────────────────────────
  - name: 'aquasec/trivy:latest'
    id: trivy-sbom
    args:
      - 'fs'
      - '.'
      - '--format=cyclonedx'
      - '--output=/workspace/sbom.json'
    dir: '/workspace/app'
    waitFor: ['compile']

  - name: 'aquasec/trivy:latest'
    id: trivy-vuln
    args:
      - 'fs'
      - '.'
      - '--format=json'
      - '--output=/workspace/trivy.json'
      - '--severity=CRITICAL,HIGH'
    dir: '/workspace/app'
    waitFor: ['compile']

  # ── Step 7: gitleaks secrets scan ────────────────────────────────────────────
  - name: 'zricethezav/gitleaks:latest'
    id: gitleaks
    args:
      - 'detect'
      - '--source=/workspace/app'
      - '--report-path=/workspace/gitleaks.json'
      - '--report-format=json'
      - '--exit-code=0'   # don't fail build, include in GateReport
    waitFor: ['unzip']

  # ── Step 8: Assemble GateReport + upload to GCS ──────────────────────────────
  - name: 'python:3.12-slim'
    id: gate-report
    entrypoint: 'python3'
    args: ['/workspace/assemble_gate_report.py']
    env:
      - 'JOB_ID=${_JOB_ID}'
      - 'TENANT_ID=${_TENANT_ID}'
      - 'STACK=${_STACK}'
      - 'ARTIFACTS_BUCKET=${_ARTIFACTS_BUCKET}'
    waitFor: ['smoke', 'semgrep', 'trivy-vuln', 'gitleaks']

# Upload all artifacts to GCS
artifacts:
  objects:
    location: 'gs://${_ARTIFACTS_BUCKET}/gate-runs/${_JOB_ID}/'
    paths:
      - '/workspace/sbom.json'
      - '/workspace/semgrep.json'
      - '/workspace/trivy.json'
      - '/workspace/gitleaks.json'
      - '/workspace/test.log'
      - '/workspace/gate_report.json'

options:
  machineType: 'E2_HIGHCPU_8'    # 8 vCPUs — fast compile+test
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'REGION=${_REGION}'

substitutions:
  _JOB_ID: 'unknown'
  _TENANT_ID: 'unknown'
  _STACK: 'java_springboot'
  _REGION: 'us-central1'
  _ARTIFACTS_BUCKET: 'vf-artifacts-dev'
  _ARTIFACT_GCS_URI: 'gs://vf-artifacts-dev/jobs/unknown/app.zip'
