# =============================================================================
# LiteLLM Proxy Configuration — VibeForge (AWS / Bedrock)
#
# Contract C11: Every LLM call is routed through this proxy.
#   - Region: us-east-1 (Virginia) — Claude 3 Haiku available directly
#   - All agent code targets model alias "agent-model"
#   - Primary: Claude 3 Haiku (fast, smart, perfect for code gen)
#   - Embeddings: Titan Text Embeddings V2
#   - Budget cap enforced per virtual key
#
# Model pricing:
#   Claude 3 Haiku  : $0.00025 / 1K input tokens
#   Titan Embed V2  : $0.00002 / 1K tokens
#   $5 budget cap → ~20M tokens/month per tenant
#
# Endpoints:
#   Chat:    POST http://litellm:4000/v1/chat/completions
#   Models:  GET  http://litellm:4000/v1/models
#   Health:  GET  http://litellm:4000/health
#
# Endpoints:
#   Chat:    POST http://litellm:4000/v1/chat/completions
#   Models:  GET  http://litellm:4000/v1/models
#   Health:  GET  http://litellm:4000/health
# =============================================================================

model_list:

  # ---------------------------------------------------------------------------
  # Primary agent model — Claude 3 Haiku (us-east-1, direct)
  # The model that was in the original plan. Available directly in us-east-1.
  # Fast, smart, excellent at code generation and instruction following.
  # ---------------------------------------------------------------------------
  - model_name: agent-model
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: us-east-1
      stream: true
      timeout: 120
      max_retries: 2

  # ---------------------------------------------------------------------------
  # Fast model — Claude 3 Haiku, lower timeout for quick classification calls
  # ---------------------------------------------------------------------------
  - model_name: fast-model
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: us-east-1
      stream: false
      timeout: 30
      max_retries: 1

  # ---------------------------------------------------------------------------
  # Smart model — Claude 3 Haiku with higher retry tolerance
  # Swap to claude-3-5-sonnet later if you need even higher quality
  # ---------------------------------------------------------------------------
  - model_name: smart-model
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: us-east-1
      stream: true
      timeout: 180
      max_retries: 3

  # ---------------------------------------------------------------------------
  # Embedding model — Amazon Titan Text Embeddings V2 (us-east-1)
  # Replaces bge-m3 from local Ollama. 1536-dimension vectors.
  # ---------------------------------------------------------------------------
  - model_name: embed-model
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: us-east-1
      timeout: 60


# =============================================================================
# Router settings — fallback chain (Contract C11)
# If Nova Micro fails → automatically escalates to Nova Lite
# =============================================================================
router_settings:
  routing_strategy: latency-based-routing
  fallbacks:
    - agent-model:
        - smart-model    # Nova Micro → Nova Lite on failure


# =============================================================================
# LiteLLM-wide settings
# =============================================================================
litellm_settings:
  # Log every call (success + failure) for observability
  # On AWS: pairs with CloudWatch (no Langfuse needed unless self-hosted)
  success_callback: []
  failure_callback: []

  # Don't fail on extra parameters Bedrock ignores
  drop_params: true

  set_verbose: false

  request_timeout: 180

  telemetry: false


# =============================================================================
# General / server settings
# =============================================================================
general_settings:
  # Master API key — injected as env var LITELLM_MASTER_KEY by ECS task
  master_key: ${LITELLM_MASTER_KEY}

  # Database for key management + spend tracking
  # Points to RDS endpoint injected by ECS task definition
  database_url: ${DATABASE_URL}

  # Real budget cap — Bedrock has actual cost per token
  # Claude 3 Haiku: ~$0.25 per 1M input tokens → $5 = ~20M tokens/month
  # That is enough for thousands of spec-to-code generation runs.
  max_budget: 5.0
  budget_duration: "30d"

  store_model_in_db: true

  # LiteLLM admin UI
  ui_access_mode: "all"
  ui_username: "admin"
  ui_password: "admin"
