# =============================================================================
# LiteLLM Proxy Configuration — VibeForge (AWS / Bedrock Edition)
#
# Contract C11: Every LLM call is routed through this proxy.
#   - All agent code targets model alias "agent-model"
#   - On AWS: routes to Amazon Nova Micro (ap-south-1, cheapest)
#   - Escalation fallback: Nova Lite (smarter, still cheap)
#   - Embeddings: Titan Text Embeddings V2 (native Bedrock)
#   - Every call logged to CloudWatch (Langfuse optional)
#   - Budget cap enforced per virtual key
#
# Model pricing (ap-south-1):
#   Nova Micro  : $0.000035 / 1K input tokens  ← primary
#   Nova Lite   : $0.00006  / 1K input tokens  ← escalation
#   Titan Embed : $0.00002  / 1K tokens        ← embeddings
#
# Endpoints:
#   Chat:    POST http://litellm:4000/v1/chat/completions
#   Models:  GET  http://litellm:4000/v1/models
#   Health:  GET  http://litellm:4000/health
# =============================================================================

model_list:

  # ---------------------------------------------------------------------------
  # Primary agent model — Amazon Nova Micro (ap-south-1 Bedrock)
  # Fastest + cheapest. Used for all agent orchestration calls.
  # ---------------------------------------------------------------------------
  - model_name: agent-model
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_region_name: ap-south-1
      stream: true
      timeout: 120
      max_retries: 2

  # ---------------------------------------------------------------------------
  # Fast model — same Nova Micro, lower timeout for quick calls
  # Used for: routing decisions, gate summaries, simple classification
  # ---------------------------------------------------------------------------
  - model_name: fast-model
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_region_name: ap-south-1
      stream: false
      timeout: 30
      max_retries: 1

  # ---------------------------------------------------------------------------
  # Smart model — Amazon Nova Lite (escalation fallback — Contract C11)
  # Automatically used when Nova Micro fails or needs deeper reasoning
  # ---------------------------------------------------------------------------
  - model_name: smart-model
    litellm_params:
      model: bedrock/amazon.nova-lite-v1:0
      aws_region_name: ap-south-1
      stream: true
      timeout: 120
      max_retries: 2

  # ---------------------------------------------------------------------------
  # Embedding model — Amazon Titan Text Embeddings V2
  # Used by the RAG ingestion + retrieval pipeline (bge-m3 replacement on AWS)
  # 1536-dimension embeddings, available in ap-south-1
  # ---------------------------------------------------------------------------
  - model_name: embed-model
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: ap-south-1
      timeout: 60


# =============================================================================
# Router settings — fallback chain (Contract C11)
# If Nova Micro fails → automatically escalates to Nova Lite
# =============================================================================
router_settings:
  routing_strategy: latency-based-routing
  fallbacks:
    - agent-model:
        - smart-model    # Nova Micro → Nova Lite on failure


# =============================================================================
# LiteLLM-wide settings
# =============================================================================
litellm_settings:
  # Log every call (success + failure) for observability
  # On AWS: pairs with CloudWatch (no Langfuse needed unless self-hosted)
  success_callback: []
  failure_callback: []

  # Don't fail on extra parameters Bedrock ignores
  drop_params: true

  set_verbose: false

  request_timeout: 180

  telemetry: false


# =============================================================================
# General / server settings
# =============================================================================
general_settings:
  # Master API key — injected as env var LITELLM_MASTER_KEY by ECS task
  master_key: ${LITELLM_MASTER_KEY}

  # Database for key management + spend tracking
  # Points to RDS endpoint injected by ECS task definition
  database_url: ${DATABASE_URL}

  # Real budget cap — Bedrock has actual cost per token
  # $5 per tenant per month hard cap (Contract C11)
  max_budget: 5.0
  budget_duration: "30d"

  store_model_in_db: true

  # LiteLLM admin UI
  ui_access_mode: "all"
  ui_username: "admin"
  ui_password: "admin"
