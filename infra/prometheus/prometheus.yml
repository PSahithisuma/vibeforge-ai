global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'vibeforge-dev'
    env: 'local'

# Alerting rules (placeholder — add in Phase 1)
# rule_files:
#   - /etc/prometheus/alerts/*.yml

scrape_configs:
  # -----------------------------------------------------------------------
  # Prometheus self-monitoring
  # -----------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # -----------------------------------------------------------------------
  # VibeForge API (FastAPI + prometheus-fastapi-instrumentator)
  # Exposed at /metrics once the API service is up (Phase 0+)
  # -----------------------------------------------------------------------
  - job_name: 'vibeforge-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # -----------------------------------------------------------------------
  # VibeForge Worker (arq worker with custom prometheus_client exposition)
  # -----------------------------------------------------------------------
  - job_name: 'vibeforge-worker'
    static_configs:
      - targets: ['worker:9000']
    metrics_path: /metrics
    scrape_interval: 10s

  # -----------------------------------------------------------------------
  # PostgreSQL exporter (postgres_exporter sidecar — add in Phase 1)
  # -----------------------------------------------------------------------
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # -----------------------------------------------------------------------
  # Redis exporter
  # -----------------------------------------------------------------------
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # -----------------------------------------------------------------------
  # Qdrant built-in metrics
  # -----------------------------------------------------------------------
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /metrics
    scrape_interval: 30s
